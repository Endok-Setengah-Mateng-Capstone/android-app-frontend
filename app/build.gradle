plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.ksp)
}

android {
    namespace 'id.sch.man3merangin.ujian'
    compileSdk 35

    defaultConfig {
        applicationId 'id.sch.man3merangin.ujian'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '2.4.1'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'API_BASE_URL', '"http://10.0.2.2:3000"'
        }
        release {
            // ponytail: placeholder host, set the school server URL before release
            buildConfigField 'String', 'API_BASE_URL', '"https://ujian.man3merangin.sch.id"'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    // ponytail: schemas ride in the debug APK so Robolectric MigrationTestHelper finds them; move to androidTest/real instrumented tests if APK size matters
    sourceSets.debug.assets.srcDir("$projectDir/schemas")
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.activity.compose

    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons

    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

    implementation libs.androidx.work.runtime.ktx

    implementation libs.kotlinx.serialization.json
    implementation libs.okhttp

    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.okhttp.mockwebserver
    testImplementation libs.androidx.work.testing
    testImplementation libs.androidx.room.testing
    testImplementation libs.androidx.compose.ui.test.junit4

    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest
}
